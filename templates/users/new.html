{%extends 'shared/layout.html'%}

{%block content%}

<form action="{{url_for('routes.create_user')}}" method="POST">

  <img alt="User avatar"
    src="https://avatars3.githubusercontent.com/u/72724639?s=400&u=964a4803693899ad66a9229db55953a3dbaad5c6&v=4" />

  <label for="email">Email</label>
  <input type="email" name="email" id="email" placeholder="email\@example.com" />

  <label for="profile_img">Profile Image</label>
  <input type="text" name="profile_img" id="profile_img" placeholder="http://" />

  <label for="first_name">First name</label>
  <input type="text" name="first_name" id="first_name" placeholder="Charly" />

  <label for="last_name">Last name</label>
  <input type="text" name="last_name" id="last_name" placeholder="Olivas" />


  <label for="phone">Phone number</label>
  <input type="text" name="phone" id="phone" placeholder="12341234" />


  <label for="address">Address</label>
  <input type="text" name="address" id="address" placeholder="123 St." />


  <input type="password" placeholder="New" />

  <input type="submit" placeholder="submit" />

</form>

{%endblock%}
