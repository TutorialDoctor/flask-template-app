{% extends "shared/layout.html" %}


{% block content %}

<h1 class="text-4xl">Show Roles</h1>

<div class="container my-4">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-objects-center">
      <a href="{{ url_for('routes.resource_route',resource='roles') }}" class="btn btn-outline-secondary">
        &larr; Back to Roles
      </a>
      <h2 class="mt-4">Role Details #{{ object.id }}</h2>
    </div>
    <div class="card-body">
      <h3 class="card-title">{{ object.name }}</h3>
    </div>
    <div class="card-footer flex gap-2">
      {# Link to Edit mode via ?action=edit #}
      <a href="{{ url_for('routes.resource_route', id=object.id, action='edit', resource='roles') }}" class="btn btn-warning">
        Edit
      </a>

      {# Delete Form #}
      <form action="{{ url_for('routes.resource_route', id=object.id, action='delete', resource='roles') }}" method="POST" onsubmit="return confirm('Delete this role?');">
        <input type="hidden" name="_method" value="DELETE">
        <button type="submit" class="btn btn-danger">Delete</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
